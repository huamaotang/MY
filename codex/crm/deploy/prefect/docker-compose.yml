services:
  prefect-postgres:
    image: postgres:17-alpine
    container_name: crm-prefect-postgres
    environment:
      POSTGRES_DB: ${PREFECT_POSTGRES_DB:-prefect}
      POSTGRES_USER: ${PREFECT_POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD:-prefect}
    ports:
      - "127.0.0.1:${PREFECT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - crm-prefect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  crm-prefect-postgres-data:
    name: crm-prefect-postgres-data
