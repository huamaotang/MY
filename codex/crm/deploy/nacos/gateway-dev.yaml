server:
  port: 8780
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:qwer8989}
    timeout: 2s
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
            redis-rate-limiter.requestedTokens: 1
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: system
          uri: lb://system
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/menus/**
          filters:
            - StripPrefix=1
        - id: customer
          uri: lb://customer
          predicates:
            - Path=/api/customers/**,/api/contacts/**,/api/follow-records/**
          filters:
            - StripPrefix=1
        - id: fund
          uri: lb://fund
          predicates:
            - Path=/api/funds/**
          filters:
            - StripPrefix=1

crm:
  access-log:
    enabled: true
    admin-url: "${CRM_ACCESS_LOG_ADMIN_URL:http://127.0.0.1:8781/api}"
    ingest-token: "${CRM_ACCESS_LOG_TOKEN:change-this-access-log-token}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,serviceregistry
